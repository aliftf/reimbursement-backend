spring.application.name=reimbursement-backend

spring.datasource.url=jdbc:mysql://localhost:3306/db_reimbursement?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.column_ordering_strategy=legacy
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jackson.time-zone=Asia/Jakarta