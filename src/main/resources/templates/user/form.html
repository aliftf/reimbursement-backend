<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>User Form</h3>
    <a th:href="@{/user}"  class="fs-6">Back</a>
  </div>

  <form method="post" th:object="${user}" th:action="@{/user/save}">
    <div class="d-flex flex-column gap-3">
      <div class="">
        <label for="id" class="form-label">Id</label>
        <input class="form-control" type="number" id="id" name="id" th:field="${user.id}" placeholder="id">
      </div>
      <div class="">
        <label for="username" class="form-label">Full Name</label>
        <input class="form-control" type="text" id="username" name="username" th:field="${user.username}" placeholder="Username">
      </div>
      <div class="">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" th:field="${user.password}" placeholder="Password">
      </div>
      <div class="">
        <label for="workEmail" class="form-label">Work Email</label>
        <input class="form-control" type="text" id="workEmail" name="workEmail" th:field="${user.workEmail}" placeholder="Work Email">
      </div>
      <div class="">
        <label for="employee" class="form-label">Employee</label>
        <select class="form-select" id="employee" th:field="${user.employee.id}">
          <option
            th:each="employee : ${employees}"
            th:value="${employee.id}"
            th:text="${employee.fullName}"></option>
        </select>
      </div>
      <div class="">
        <label for="role" class="form-label">Role</label>
        <select class="form-select" id="role" th:field="${user.role.id}">
          <option
              th:each="role : ${roles}"
              th:value="${role.id}"
              th:text="${role.name}"></option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-5">Save Changes</button>
  </form>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
