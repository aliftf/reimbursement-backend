<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Users</h3>
    <a th:href="@{/user/form}" class="btn btn-primary">Add User</a>
  </div>

  <table class="table table-striped table-bordered shadow-sm bg-white">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Work Email</th>
      <th>Employee</th>
      <th>Role</th>
      <th style="width: 180px;">Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.id}"></td>
      <td th:text="${u.username}"></td>
      <td th:text="${u.workEmail}"></td>
      <td th:text="${u.employee.fullName}"></td>
      <td th:text="${u.role.name}"></td>
      <td>
        <a th:href="@{/user/form/{id} (id = ${u.getId()})}" class="btn btn-sm btn-warning">Edit</a>
        <form th:action="@{/user/delete/{id} (id=${u.getId()})}" method="post" class="d-inline">
          <button type="submit" class="btn btn-sm btn-danger" th:onclick="|return confirm('Delete this user ${u.getId()}?');|">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

</div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
