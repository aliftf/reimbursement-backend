<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Employee Form</h3>
    <a th:href="@{/employee}"  class="fs-6">Back</a>
  </div>

  <form method="post" th:object="${employee}" th:action="@{/employee/save}">
    <div class="d-flex flex-column gap-3">
      <div class="">
        <label for="id" class="form-label">Id</label>
        <input class="form-control" type="number" id="id" name="id" th:field="${employee.id}" placeholder="id">
      </div>
      <div class="">
        <label for="fullName" class="form-label">Full Name</label>
        <input class="form-control" type="text" id="fullName" name="fullName" th:field="${employee.fullName}" placeholder="Name">
      </div>
      <div class="">
        <label for="phoneNumber" class="form-label">Phone Number</label>
        <input class="form-control" type="text" id="phoneNumber" name="phoneNumber" th:field="${employee.phoneNumber}" placeholder="Name">
      </div>
      <div class="">
        <label for="personalEmail" class="form-label">Personal Email</label>
        <input class="form-control" type="text" id="personalEmail" name="personalEmail" th:field="${employee.personalEmail}" placeholder="Name">
      </div>
      <div class="">
        <label for="department" class="form-label">Department</label>
        <select class="form-select" id="department" th:field="${employee.department.id}">
          <option
            th:each="department : ${departments}"
            th:value="${department.id}"
            th:text="${department.name}"
            th:selected="${department.id == employee.department.id}"></option>
        </select>
      </div>
      <div class="">
        <label for="manager" class="form-label">Manager</label>
        <select class="form-select" id="manager" th:field="${employee.manager.id}">
          <option value="">No Manager</option>
          <option
              th:each="manager : ${managers}"
              th:value="${manager.id}"
              th:text="${manager.fullName}"></option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-5">Save Changes</button>
  </form>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
