<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/plugins/datatables/media/js/jquery.js"></script>
<script src="../../assets/plugins/datatables/media/js/jquery.dataTables.js"></script>
<script>
    $(document).ready(() => {
        console.log("Hello World");
        let table = $('#myTable').DataTable({
            serverSide: true,
            ajax: {
                url: '/api/employee',
                type: 'GET',
                dataSrc: 'data'
            },
            columnDefs: [
                {
                    targets: [1,3],
                    orderable: false,
                    searchable: false
                }
            ],
            columns: [
                {
                    data: 'id',
                    name: 'id',
                    autoWidth: true
                },
                {
                    data: 'fullName',
                    name: 'fullName',
                    autoWidth: true
                },
                {
                    data: 'phoneNumber',
                    name: 'phoneNumber',
                    autoWidth: true
                },
                {
                    data: 'personalEmail',
                    name: 'personalEmail',
                    autoWidth: true
                },
                {
                    data: 'departmentName',
                    name: 'departmentName',
                    autoWidth: true
                },
                {
                    data: 'managerName',
                    name: 'managerName',
                    autoWidth: true,
                    render: function (data, type, full, meta) {
                        return (full.managerName != null) ? full.managerName : `Tidak ada manager`;
                    }
                },
                {
                    render: function (data, type, full, meta) {
                        return `<a th:href="@{/employee/form/${full.id}}" class="btn btn-sm btn-warning">Edit</a>`;
                    }
                },
            ]
        });
    })
</script>
