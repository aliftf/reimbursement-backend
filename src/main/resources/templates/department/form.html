<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Department Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Department Form</h3>
      <a th:href="@{/department}"  class="fs-6">Back</a>
    </div>

    <form method="post" th:object="${department}" th:action="@{/department/save}">
      <div class="d-flex flex-column gap-3">
        <div class="">
          <label for="id" class="form-label">Id</label>
          <input class="form-control" type="number" id="id" name="id" th:field="${department.id}" placeholder="id">
        </div>
        <div class="">
          <label for="name" class="form-label">Name</label>
          <input class="form-control" type="text" id="name" name="name" th:field="${department.name}" placeholder="Name">
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-5">Save Changes</button>
    </form>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
