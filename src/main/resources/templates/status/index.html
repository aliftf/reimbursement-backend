<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Status List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Status</h3>
      <a th:href="@{/status/form}" class="btn btn-primary">Add Status</a>
    </div>

    <table class="table table-striped table-bordered shadow-sm bg-white">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th style="width: 180px;">Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="s : ${statuses}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.name}"></td>
        <td>
          <a th:href="@{/status/form/{id} (id = ${s.getId()})}" class="btn btn-sm btn-warning">Edit</a>
          <form th:action="@{/status/delete/{id} (id=${s.getId()})}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-danger" th:onclick="|return confirm('Delete this status ${s.getId()}?');|">Delete</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

  </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
